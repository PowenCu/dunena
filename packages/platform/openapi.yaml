            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/replication/replicas/{id}":
    delete:
      tags: ["Replication"]
      summary: Remove replica
      description: Removes a replication replica by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Replica ID
      responses:
        200:
          description: Replica removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean
  /replication/enable:
    post:
      tags: ["Replication"]
      summary: Enable replication
      description: Enables data replication to all configured replicas.
      responses:
        200:
          description: Replication enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
  /replication/disable:
    post:
      tags: ["Replication"]
      summary: Disable replication
      description: Disables data replication.
      responses:
        200:
          description: Replication disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
  /rate-limits:
    get:
      tags: ["RateLimits"]
      summary: List rate limits
      description: Returns all configured namespace-scoped rate limit rules.
      responses:
        200:
          description: Rate limit list
          content:
            application/json:
              schema:
                type: object
                properties:
                  limits:
                    type: array
                    items:
                      type: object
    post:
      tags: ["RateLimits"]
      summary: Configure rate limit
      description: Creates or updates a namespace-scoped rate limit rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateLimitConfig"
      responses:
        201:
          description: Rate limit configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  namespace:
                    type: string
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/rate-limits/{namespace}":
    delete:
      tags: ["RateLimits"]
      summary: Remove rate limit
      description: Removes a namespace-scoped rate limit rule.
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Namespace
      responses:
        200:
          description: Rate limit removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean
    get:
      tags: ["RateLimits"]
      summary: Get rate limit stats
      description: Returns rate limit configuration and current usage statistics for a specific namespace.
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Namespace
      responses:
        200:
          description: Rate limit stats
          content:
            application/json:
